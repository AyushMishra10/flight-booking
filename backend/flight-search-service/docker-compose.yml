version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: airline_postgres
    environment:
      POSTGRES_USER: airline_user
      POSTGRES_PASSWORD: airline_password
      POSTGRES_DB: airline_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - airline_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: airline_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@airline.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - airline_network

volumes:
  postgres_data:

networks:
  airline_network:
    driver: bridge