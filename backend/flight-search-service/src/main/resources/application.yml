server:
  port: ${PORT:8181}

# Spring Boot 4: Enable Project Loom Virtual Threads for high-throughput I/O
spring:
  threads:
    virtual:
      enabled: true

  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5433/airline_db
    username: airline_user
    password: airline_password

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  cors:
    allowed-origins: http://localhost:4200